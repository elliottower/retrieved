name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras --dev
      # The floor is `fail_under` in pyproject.toml, so CI and a developer's own run check the
      # same number. COVERAGE_PROCESS_START is what lets coverage see the hook, which is tested
      # the way it runs -- as a subprocess. Without it that module reports 0% with nine tests
      # against it.
      - run: uv run pytest -q --cov=retrieved --cov-report=term
        env:
          COVERAGE_PROCESS_START: pyproject.toml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  # A version is consumed the moment it uploads to PyPI and can never be reused, so a wheel that
  # fails inspection on release day costs the number. Building and checking it on every pull
  # request means that is found on an ordinary day instead.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - run: uv sync --dev
      - run: uv build
      - run: uv run twine check dist/*
      - name: the wheel must carry the package and nothing else
        run: |
          python - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          tops = {n.split("/")[0] for n in names}
          # Version-agnostic: pinning the dist-info name here would break on the next bump.
          extra = {t for t in tops if t != "retrieved" and not t.startswith("retrieved-")}
          assert not extra, f"{wheel.name} also ships {sorted(extra)}"
          assert "retrieved/refuse.py" in names, "the denylist is not in the wheel"
          print(f"{wheel.name}: {len(names)} files, top level {sorted(tops)}")
          PY

  # The denylist is the security boundary of this package. If these pass while the guard is
  # removed they are decoration, so the job removes it and requires the suite to go red.
  denylist-can-fail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
      - run: uv sync --dev
      - name: refusing nothing must break the tests
        run: |
          python - <<'PY'
          import pathlib
          p = pathlib.Path("src/retrieved/refuse.py")
          s = p.read_text()
          marker = "def check(url: str) -> None:"
          body = s.index(marker) + len(marker)
          end = s.index("def check_final")
          p.write_text(s[:body] + '\n    """Guard removed by CI."""\n    return\n\n\n' + s[end:])
          PY
          if uv run pytest tests/test_refuse.py -q; then
            echo "::error::the denylist tests pass with the guard removed"
            exit 1
          fi
          echo "the denylist tests fail without the guard, as they must"
