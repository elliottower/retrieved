version: 2

updates:
  # Pinned action SHAs go stale silently: nothing in a checkout says the hash you pinned is three
  # releases behind, and a pin is only as good as the review that set it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      # Do not propose a release in its first week: that is the window in which a compromised
      # version is most likely to still be live.
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      dev-tooling:
        dependency-type: development
    commit-message:
      prefix: deps
