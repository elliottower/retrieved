name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Asks PyPI whether it would accept an upload, and throws the token away. A binding that has
  # drifted is then found on an ordinary day rather than on release day, when a partial upload
  # cannot be undone: a rejected version is free, a consumed one is permanent.
  binding:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - name: mint an upload token and discard it
        run: |
          claim=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=pypi" | python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])')
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"$claim\"}" https://pypi.org/_/oidc/mint-token)
          echo "PyPI answered $code"
          [ "$code" = "200" ] || { echo "::error::PyPI would refuse this upload"; exit 1; }

  publish:
    needs: binding
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          # No cache on a release run: a poisoned cache entry would be baked into a wheel
          # that is then published under this project's name.
          enable-cache: false
      - run: uv build
      - run: uv publish --trusted-publishing always
