[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retrieved"
version = "0.1.0"
description = "Keep the bytes an agent fetched, so a claim about a page can be checked against the page."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Elliot Tower", email = "elliot@elliottower.ai" }]
keywords = ["provenance", "reproducibility", "agents", "web archiving", "citations"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
# A headless browser is a few hundred megabytes and a second per page. Most captures do not need
# one, and requiring it would stop most people installing this at all.
browser = ["playwright>=1.44"]

[project.urls]
Homepage = "https://github.com/elliottower/retrieved"
Source = "https://github.com/elliottower/retrieved"

[project.scripts]
retrieved = "retrieved.cli:main"
retrieved-hook = "retrieved.hook:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pytest-cov>=5", "coverage[toml]>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/retrieved"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]        # assert is how tests assert

[tool.ruff.lint.per-file-ignores]
# Test URLs carry fake tokens on purpose, and the hook tests run it as a subprocess because
# that is how a hook runs.
"tests/*" = ["S105", "S106", "S603"]

[tool.coverage]
# Package name, not a path. A CLI test runs the command from a temporary directory, where a
# relative source path matches nothing -- so the CLI reports 0% while its tests pass.
run.source_pkgs = ["retrieved"]
run.omit = ["*/tests/*"]
run.branch = true
# The hook is tested the way it runs: as a subprocess reading stdin. Without these, coverage
# sees none of it and reports 0% for a module with nine tests against it.
run.parallel = true
run.sigterm = true
report.exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    # The import guard for an optional dependency: exercised only where playwright is absent,
    # which is every CI run, so the other branch is unreachable there by construction.
    "except ImportError:",
]
# Set to what the suite actually reaches today, so a drop is a failure rather than a shrug.
# Raise it when coverage rises; never lower it to make a build pass.
report.fail_under = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
