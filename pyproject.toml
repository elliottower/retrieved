[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retrieved"
version = "0.1.0"
description = "Keep the bytes an agent fetched, so a claim about a page can be checked against the page."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Elliot Tower", email = "elliot@elliottower.ai" }]
keywords = ["provenance", "reproducibility", "agents", "web archiving", "citations"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0.1",
]

[project.urls]
Homepage = "https://github.com/elliottower/retrieved"
Source = "https://github.com/elliottower/retrieved"

[project.scripts]
retrieved = "retrieved.cli:main"
retrieved-hook = "retrieved.hook:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/retrieved"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]        # assert is how tests assert

[tool.ruff.lint.per-file-ignores]
# Test URLs carry fake tokens on purpose, and the hook tests run it as a subprocess because
# that is how a hook runs.
"tests/*" = ["S105", "S106", "S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
